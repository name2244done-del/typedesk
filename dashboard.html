<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · TypeDesk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Mobile & Desktop Responsive Fixes for Dashboard */
    body { background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%); min-height: 100vh; }
    
    .dash-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    
    /* Top Navbar */
    .dash-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: rgba(255,255,255,0.7); padding: 12px 24px; border-radius: 16px; border: 1px solid white; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .avatar-circle { width: 40px; height: 40px; background: #e0e7ff; color: #2563eb; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
    
    /* Hero Text */
    .hero-text h1 { font-size: 32px; font-weight: 800; color: #0f172a; line-height: 1.2; margin-bottom: 8px; }
    .hero-text h1 span { color: #2563eb; }
    .hero-text p { color: #64748b; font-size: 15px; }

    /* Wallet Banner (Compact for Mobile) */
    .wallet-card { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 20px; padding: 24px; color: white; margin: 24px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .wallet-top { display: flex; justify-content: space-between; align-items: center; }
    .wallet-coins { display: flex; align-items: center; gap: 10px; font-size: 40px; font-weight: 800; margin: 12px 0; }
    .wallet-coin-icon { font-size: 45px; }
    .progress-track { background: #334155; height: 8px; border-radius: 10px; width: 100%; margin: 10px 0; overflow: hidden; }
    .progress-fill { background: #eab308; height: 100%; width: 5%; border-radius: 10px; }
    .history-btn { background: #eab308; color: #0f172a; font-weight: 700; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; margin-top: 15px; display: inline-block; }

    /* Metrics Row */
    .metric-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 30px; }
    .m-card { background: white; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
    .m-icon { width: 45px; height: 45px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
    .m-icon.blue { background: #eff6ff; color: #2563eb; }
    .m-icon.green { background: #f0fdf4; color: #16a34a; }
    .m-data h4 { font-size: 12px; color: #64748b; font-weight: 600; }
    .m-data .val { font-size: 20px; font-weight: 800; color: #0f172a; margin-top: 2px; }

    /* Task Grid */
    .section-head { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 16px; }
    .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .task-card { background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
    .task-card .icon { font-size: 36px; margin-bottom: 12px; }
    .task-card h3 { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .task-card p { font-size: 12px; color: #64748b; margin-bottom: 12px; }
    .task-card .coins { font-size: 13px; font-weight: 700; color: #d97706; margin-bottom: 16px; }

    /* Mobile View */
    @media (max-width: 600px) {
      .dash-nav { flex-direction: column; gap: 16px; text-align: center; }
      .hero-text h1 { font-size: 26px; }
      .wallet-card { padding: 20px; }
      .wallet-coins { font-size: 32px; }
      .wallet-coin-icon { font-size: 36px; }
      .metric-row { grid-template-columns: 1fr 1fr; gap: 10px; }
      .m-card { flex-direction: column; text-align: center; padding: 12px; gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="dash-container">
    
    <!-- Navbar -->
    <nav class="dash-nav">
      <div class="user-profile">
        <div class="avatar-circle" id="userAvatar">U</div>
        <div>
          <div style="font-size: 15px; font-weight: 700; color: #0f172a;" id="userName">User</div>
          <div style="font-size: 11px; color: #d97706; font-weight: 700;">👑 Premium User</div>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" id="logoutBtn" style="border-radius: 8px;">Sign Out</button>
    </nav>

    <!-- Hero Text -->
    <div class="hero-text">
      <h1>Improve Your Typing <br><span>Skills and Earn Rewards!</span></h1>
      <p>Practice, complete challenges, earn coins and redeem amazing rewards.</p>
    </div>

    <!-- Wallet Banner -->
    <div class="wallet-card">
      <div class="wallet-top">
        <span style="font-size: 14px; font-weight: 500; opacity: 0.8;">Your Wallet</span>
      </div>
      <div class="wallet-coins">
        <span class="wallet-coin-icon">🪙</span>
        <span id="walletBalance">0</span>
        <span style="font-size: 16px; opacity: 0.7; font-weight: 500; margin-top: 10px;">Coins</span>
      </div>
      
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">550 more points to unlock Silver Badge</div>
      
      <button class="history-btn">View History →</button>
    </div>

    <!-- Metrics -->
    <div class="metric-row">
      <div class="m-card">
        <div class="m-icon blue">⌨️</div>
        <div class="m-data">
          <h4>Typing Speed</h4>
          <div class="val">0 WPM</div>
        </div>
      </div>
      <div class="m-card">
        <div class="m-icon green">🎯</div>
        <div class="m-data">
          <h4>Accuracy</h4>
          <div class="val" id="metricAccuracy">100%</div>
        </div>
      </div>
    </div>

    <!-- Tasks Grid -->
    <h2 class="section-head">⚡ Typing Challenges</h2>
    <div class="task-grid" id="taskList">
      <p class="text-muted" style="padding: 20px;">Loading challenges...</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ⚠️ APNI SUPABASE KEYS YAHAN DALEIN
    const SUPABASE_URL = 'YAHAN_APNA_PROJECT_URL_DALEIN';
    const SUPABASE_ANON_KEY = 'YAHAN_APNI_ANON_KEY_DALEIN';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initDashboard() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session) { window.location.href = 'login.html'; return; }

      const userEmail = session.user.email;
      document.getElementById('userName').textContent = userEmail.split('@')[0];
      document.getElementById('userAvatar').textContent = userEmail[0].toUpperCase();

      // Fetch User Points (Agar table mein nahi hai toh 0 dikhayega)
      try {
        const { data: profile } = await supabaseClient.from('user_profiles').select('total_points').eq('id', session.user.id).single();
        if (profile) {
          document.getElementById('walletBalance').textContent = profile.total_points || 0;
        }
      } catch(e) { console.log("Profile fetch error", e); }

      loadTasks();
    }

    async function loadTasks() {
      const { data: tasks, error } = await supabaseClient.from('typing_tasks').select('*').eq('is_active', true).limit(6);
      const taskList = document.getElementById('taskList');
      
      if (error || !tasks || tasks.length === 0) {
        taskList.innerHTML = `<p class="text-muted">No challenges available right now.</p>`;
        return;
      }

      taskList.innerHTML = tasks.map(task => {
        let icon = '📝';
        if (task.category === 'Science') icon = '🌱';
        else if (task.category === 'Company') icon = '💼';
        else if (task.category === 'Education') icon = '🎓';

        return `
          <div class="task-card">
            <div class="icon">${icon}</div>
            <h3>${task.title}</h3>
            <p>Type ${task.pages} page(s) · ${task.time_limit_minutes} mins</p>
            <div class="coins">🪙 +${task.points_reward} Coins</div>
            <button class="btn btn-primary btn-full" onclick="window.location.href='typing.html?id=${task.id}'">Start Now →</button>
          </div>
        `;
      }).join('');
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    initDashboard();
  </script>
</body>
</html>
