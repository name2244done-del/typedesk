<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eff7ff">
  <title>Reset Password · TypeDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg,#edf7ff,#e8f1ff,#f7faff);
      font-family: Inter, sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 20px 60px rgba(50,100,160,.12);
      backdrop-filter: blur(20px);
    }

    .reset-logo {
      color: #173b67;
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .reset-logo span { color: #3478f6; }

    h1 {
      color: #173b67;
      font-size: 25px;
      margin: 0 0 9px;
    }

    .subtitle {
      color: #7184a2;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .reset-message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .reset-message.show { display: block; }
    .reset-message.error { background: #fff0f1; color: #b83b4b; }
    .reset-message.success { background: #e9f7f0; color: #16845b; }

    .reset-form { display: none; }
    .reset-form.visible { display: block; }

    .reset-form label {
      display: block;
      margin: 16px 0 7px;
      color: #29466c;
      font-size: 13px;
      font-weight: 650;
    }

    .reset-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce8f7;
      border-radius: 11px;
      background: white;
      outline: none;
    }

    .reset-form input:focus {
      border-color: #3478f6;
      box-shadow: 0 0 0 3px #3478f620;
    }

    .reset-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg,#3478f6,#5798ff);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #3478f6;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <div class="reset-logo">TypeDesk<span>.</span></div>

    <h1>Set a new password</h1>
    <p class="subtitle">
      Choose a new password for your TypeDesk account.
    </p>

    <div id="resetMessage" class="reset-message"></div>

    <form id="resetForm" class="reset-form">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Minimum 8 characters"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter password again"
        required
      >

      <button id="resetButton" class="reset-button" type="submit">
        Update Password
      </button>
    </form>

    <a href="login.html" class="back-link">Back to Sign In</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const config = window.TYPEDESK_SUPABASE_CONFIG;

    const supabaseClient = window.supabase.createClient(
      config.url,
      config.publishableKey
    );

    const resetForm = document.getElementById('resetForm');
    const resetMessage = document.getElementById('resetMessage');
    const resetButton = document.getElementById('resetButton');

    let recoverySessionReady = false;

    function showMessage(message, type = 'error') {
      resetMessage.textContent = message;
      resetMessage.className = 'reset-message show ' + type;
    }

    function showResetForm() {
      recoverySessionReady = true;
      resetForm.classList.add('visible');
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        showResetForm();
        showMessage('Recovery link verified. Enter your new password.', 'success');
      }
    });

    async function checkRecoverySession() {
      const params = new URLSearchParams(
        window.location.hash.replace(/^#/, '')
      );

      if (params.get('type') !== 'recovery') return;

      const { data, error } = await supabaseClient.auth.getSession();

      if (!error && data.session) {
        showResetForm();
        showMessage('Recovery link verified. Enter your new password.', 'success');
      }
    }

    checkRecoverySession();

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!recoverySessionReady) {
        showMessage('Please open a valid password recovery link first.');
        return;
      }

      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage('Password must contain at least 8 characters.');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Both passwords do not match.');
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = 'Updating...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        await supabaseClient.auth.signOut();

        resetForm.classList.remove('visible');

        showMessage(
          'Password updated successfully. You can now sign in with your new password.',
          'success'
        );

      } catch (error) {
        showMessage(error.message || 'Could not update password.');
      } finally {
        resetButton.disabled = false;
        resetButton.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
